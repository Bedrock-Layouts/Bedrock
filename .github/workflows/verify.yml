# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write lets lerna push the version commit and tags
      contents: write
      # id-token: write enables npm OIDC trusted publishing (no npm token needed)
      id-token: write
    env:
      HUSKY: 0
      GH_TOKEN: ${{secrets.GH_TOKEN}}
    strategy:
      matrix:
        node-version: [">=24.15.0 <25"]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - run: yarn config set registry https://registry.npmjs.org
      - run: yarn
      - run: yarn verify
      - run: git checkout main
      - run: git config --global user.email  'travis.mair@gmail.com'
      - run: git config --global user.name  'Jarvis1010'
      # npm >= 11.5.1 is required for OIDC trusted publishing
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npm install -g npm@latest
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npx lerna publish --conventional-commits --yes
