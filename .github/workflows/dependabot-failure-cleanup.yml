name: Dependabot Failed Build Auto-Fix Request

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  request-fix-for-failed-dependabot-pr:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Request automatic fix for failed Dependabot pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const { workflow_run } = context.payload;
            const pullRequests = workflow_run.pull_requests || [];
            const marker = '<!-- dependabot-auto-fix-request -->';

            if (pullRequests.length === 0) {
              core.info('No pull requests were associated with this failed workflow run.');
              return;
            }

            for (const pullRequestRef of pullRequests) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequestRef.number,
              });

              if (pullRequest.user?.login !== 'dependabot[bot]') {
                core.info(`Skipping PR #${pullRequest.number}; author is ${pullRequest.user?.login}.`);
                continue;
              }

              if (pullRequest.state !== 'open') {
                core.info(`Skipping PR #${pullRequest.number}; PR is already ${pullRequest.state}.`);
                continue;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });

              const hasRequestForSha = comments.some((comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker) &&
                comment.body?.includes(workflow_run.head_sha)
              );

              if (hasRequestForSha) {
                core.info(`Skipping PR #${pullRequest.number}; auto-fix already requested for ${workflow_run.head_sha}.`);
                continue;
              }

              const body = [
                marker,
                '⚠️ **Dependabot PR Build Failed**',
                '',
                `@copilot Please fix this Dependabot PR so the **Build** workflow passes and the PR can be merged.`,
                '',
                `Failed run: ${workflow_run.html_url}`,
                `Commit: \`${workflow_run.head_sha}\``,
                '',
                'Keep the changes minimal and focused on resolving the failing checks.',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body,
              });

              core.info(`Requested auto-fix for Dependabot PR #${pullRequest.number} after a failed Build run.`);
            }
